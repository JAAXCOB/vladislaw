name: Deploy AVR AI controller MAX reply hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-ai-controller-hotfix.yml

concurrency:
  group: deploy-avr-ai-controller-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: e39f7d777c937e824f5a0a06d5d9f09039c69f28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ai-controller-test.txt
      - name: Re-run controller tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python -m pip install --disable-pip-version-check -r requirements-ai-controller-test.txt
          python -m pytest -q tests/test_ai_controller.py
      - name: Build controller-only offline release
        run: |
          set -euo pipefail
          mkdir -p build/controller/wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest build/controller/wheelhouse -r requirements-ai-controller.txt
          tar --exclude='__pycache__' --exclude='*.py[cod]' \
            -cf - ai_controller | tar -C build/controller -xf -
          cp requirements-ai-controller.txt build/controller/
          mkdir -p build/controller/ops/systemd
          cp ops/systemd/avr-ai-controller.service build/controller/ops/systemd/
          printf '%s\n' "$RELEASE_SHA" > build/controller/RELEASE_ID
          printf '3.10\n' > build/controller/PYTHON_VERSION
          tar -C build/controller -czf "build/avr-ai-controller-$RELEASE_SHA.tar.gz" .
          (
            cd build
            sha256sum "avr-ai-controller-$RELEASE_SHA.tar.gz" > "avr-ai-controller-$RELEASE_SHA.tar.gz.sha256"
          )
      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Stage, activate, verify, and roll back on failure
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          ssh_options=(
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20
          )
          artifact="avr-ai-controller-$RELEASE_SHA.tar.gz"
          checksum="$artifact.sha256"
          sshpass -e scp "${ssh_options[@]}" "build/$artifact" "build/$checksum" root@130.49.173.150:/var/tmp/
          sshpass -e ssh "${ssh_options[@]}" root@130.49.173.150 \
            "RELEASE_SHA='$RELEASE_SHA' ARTIFACT='$artifact' CHECKSUM='$checksum' bash -s" <<'REMOTE'
          set -euo pipefail
          set +x
          base=/opt/vladislaw/ai-controller
          release="$base/releases/$RELEASE_SHA"
          current="$base/current"
          previous="$(readlink -f "$current" 2>/dev/null || true)"
          before_xlsx="$(mktemp)"
          after_xlsx="$(mktemp)"
          switched=0

          cleanup() {
            rm -f "/var/tmp/$ARTIFACT" "/var/tmp/$CHECKSUM" "$before_xlsx" "$after_xlsx"
          }
          rollback() {
            rc=$?
            if [ "$switched" -eq 1 ] && [ -n "$previous" ] && [ -d "$previous" ]; then
              ln -sfn "$previous" "$current.rollback"
              mv -Tf "$current.rollback" "$current"
              systemctl restart avr-ai-controller.service || true
            fi
            cleanup
            exit "$rc"
          }
          trap rollback ERR

          test "$(systemctl is-active max-webhook.service)" = active
          test "$(systemctl is-active avr-ai-controller.service)" = active
          test -f /opt/vladislaw/.env.ai-controller
          find /opt/vladislaw -type f -name '*.xlsx' -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum >"$before_xlsx"

          cd /var/tmp
          sha256sum -c "$CHECKSUM"
          test ! -e "$release"
          install -d -o root -g avrai -m 0750 "$release"
          tar --extract --gzip --file "$ARTIFACT" --directory "$release" --no-same-owner
          test "$(cat "$release/RELEASE_ID")" = "$RELEASE_SHA"
          test "$(cat "$release/PYTHON_VERSION")" = "3.10"
          python3 -m venv "$release/.venv"
          "$release/.venv/bin/pip" install --disable-pip-version-check --no-index \
            --find-links "$release/wheelhouse" -r "$release/requirements-ai-controller.txt"
          chown -R root:avrai "$release"
          chmod -R u=rwX,g=rX,o= "$release"

          systemd-run --quiet --wait --collect --uid=avrai \
            --working-directory="$release" \
            --property=EnvironmentFile=/opt/vladislaw/.env.ai-controller \
            "$release/.venv/bin/python" -c \
            "from ai_controller.config import ControllerSettings; ControllerSettings()"

          ln -sfn "$release" "$current.next"
          mv -Tf "$current.next" "$current"
          switched=1
          systemctl restart avr-ai-controller.service

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8010/health >/dev/null \
              && curl -fsS http://127.0.0.1:8010/audit/verify | grep -q '"valid":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          test "$(systemctl is-active avr-ai-controller.service)" = active
          test "$(systemctl is-active max-webhook.service)" = active

          find /opt/vladislaw -type f -name '*.xlsx' -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum >"$after_xlsx"
          cmp -s "$before_xlsx" "$after_xlsx"

          switched=0
          trap - ERR
          cleanup
          printf 'DEPLOYED_RELEASE=%s\n' "$RELEASE_SHA"
          printf 'PREVIOUS_RELEASE=%s\n' "$previous"
          printf 'AVR_AI_CONTROLLER_ACTIVE=true\n'
          printf 'EXISTING_MAX_ACTIVE=true\n'
          printf 'EXCEL_UNCHANGED=true\n'
          REMOTE
