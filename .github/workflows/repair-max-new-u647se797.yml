name: Repair MAX new order U647SE797

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-max-new-u647se797.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and replay one MAX new order
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@130.49.173.150 'bash -se' <<'SH'
          set -euo pipefail
          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          test -n "$pid"; test "$pid" != 0
          app_root="$(readlink -f "/proc/$pid/cwd")"
          cmd0="$(tr '\0' '\n' <"/proc/$pid/cmdline" | head -n1)"
          py="$cmd0"; case "$(basename "$py")" in *python*) ;; *) py="$(dirname "$cmd0")/python" ;; esac
          "$py" - "$pid" "$app_root" <<'PY'
          import hashlib, json, os, subprocess, sys, time
          from pathlib import Path
          import httpx

          pid, app_root = sys.argv[1:]
          os.chdir(app_root); sys.path.insert(0, app_root)
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  os.environ[key.decode(errors="ignore")] = value.decode(errors="ignore")

          from scripts.daily_import import fetch_all_messages
          from webhook.av_rescue_client import sync_extracted_job
          from webhook.config import settings
          from webhook.extractor import extract_job
          from webhook.models import Message
          from webhook.reporting_rules import is_bot_generated_message, normalize_plate

          target = "У647СЕ797"
          now_ms = int(time.time()*1000); oldest_ms = now_ms-2*3600*1000
          candidates = []
          with httpx.Client(timeout=30, verify="/etc/ssl/certs/ca-certificates.crt") as client:
              for chat_id in sorted(settings.allowed_chat_ids):
                  for raw in fetch_all_messages(client, chat_id, oldest_ms, now_ms):
                      msg=Message.model_validate(raw); text=msg.resolve_text() or ""; mid=msg.body.mid if msg.body else None
                      if not mid or not text or is_bot_generated_message(text, bool(msg.sender and msg.sender.is_bot)): continue
                      if normalize_plate(text) != target: continue
                      job=extract_job(text, msg.sender.display_name if msg.sender else "unknown")
                      if job.is_new_job_request: candidates.append((int(raw.get("timestamp") or 0),chat_id,msg,text,job))

          if len(candidates) != 1: raise SystemExit(f"expected one verified new order, found {len(candidates)}")
          _timestamp, chat_id, msg, text, job = candidates[0]
          mid=msg.body.mid
          fingerprint=hashlib.sha256(text.encode("utf-8")).hexdigest()
          state_path=Path("/opt/vladislaw/data/new_order_reconcile_state.json")
          state=json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          state_had_final=state.get(mid)==fingerprint
          journal=subprocess.run(["journalctl","-u","max-webhook.service","--since","2 hours ago","--no-pager","-o","cat"],capture_output=True,text=True,timeout=30,check=True).stdout
          webhook_seen=mid in journal

          def digest(value):
              path=Path(value) if value else None
              if not path or not path.is_file(): return None
              h=hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda:handle.read(1024*1024),b""): h.update(block)
              return h.hexdigest()
          protected_before={"excel":digest(settings.excel_file_path),"payroll":digest(settings.payroll_file_path)}
          sync_extracted_job(job, chat_id, mid, text)
          protected_after={"excel":digest(settings.excel_file_path),"payroll":digest(settings.payroll_file_path)}
          if protected_before != protected_after: raise SystemExit("protected report files changed")

          queue_path=Path(settings.av_rescue_sync_queue_path)
          if not queue_path.is_absolute(): queue_path=Path(app_root)/queue_path
          source_id=f"max:{chat_id}:{mid}"; pending=dead=0
          for path,bucket in ((queue_path,"pending"),(queue_path.with_name(queue_path.stem+".dead"+queue_path.suffix),"dead")):
              if not path.exists(): continue
              data=json.loads(path.read_text(encoding="utf-8"))
              for item in data if isinstance(data,list) else []:
                  payload=item.get("payload",item) if isinstance(item,dict) else {}
                  if payload.get("source_id")==source_id and payload.get("event")=="upsert":
                      if bucket=="pending": pending+=1
                      else: dead+=1
          if pending or dead: raise SystemExit("verified new order was not delivered")
          print("REPAIR_MAX_NEW_ORDER "+json.dumps({"target":target,"verified_source":True,"webhook_seen":webhook_seen,"reconcile_state_had_final":state_had_final,"replayed":True,"delivery_queue_clear":True,"excel_unchanged":True,"payroll_unchanged":True}))
          PY
          SH

