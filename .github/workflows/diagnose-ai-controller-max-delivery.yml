name: Diagnose AVR AI MAX delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only MAX delivery diagnosis
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import json, subprocess, urllib.request
          from pathlib import Path

          def run(args):
              p = subprocess.run(args, capture_output=True, text=True, timeout=20)
              return p.returncode, p.stdout.strip()

          env = {}
          for raw in Path("/opt/vladislaw/.env.ai-controller").read_text(errors="replace").splitlines():
              if "=" in raw and not raw.lstrip().startswith("#"):
                  key, value = raw.split("=", 1)
                  env[key.strip()] = value.strip()
          route_path = Path("/opt/vladislaw/ai-controller-data/max-controller-webhook.json")
          route = json.loads(route_path.read_text()) if route_path.is_file() else {}
          token = env.get("AVR_AI_MAX_CONTROL_TOKEN", "")
          request = urllib.request.Request(
              "https://platform-api2.max.ru/subscriptions",
              headers={"Authorization": token},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              subscriptions = json.loads(response.read()).get("subscriptions") or []
          expected_url = route.get("url", "")
          matching = [item for item in subscriptions if item.get("url") == expected_url]
          status = {
              "controller_active": run(["systemctl", "is-active", "avr-ai-controller.service"])[1],
              "existing_bot_active": run(["systemctl", "is-active", "max-webhook.service"])[1],
              "enabled": env.get("AVR_AI_MAX_CONTROL_ENABLED"),
              "transport": env.get("AVR_AI_MAX_CONTROL_TRANSPORT"),
              "allowlist_configured": bool(env.get("AVR_AI_MAX_CONTROL_CHAT_ID")) and bool(env.get("AVR_AI_MAX_CONTROL_USER_IDS")),
              "route_record": bool(expected_url),
              "subscription_count": len(subscriptions),
              "matching_subscription_count": len(matching),
              "matching_update_types": matching[0].get("update_types") if len(matching) == 1 else None,
          }
          print("AVR_MAX_DIAG " + json.dumps(status, ensure_ascii=False))
          audit = Path("/opt/vladislaw/ai-controller-data/audit.jsonl")
          if audit.is_file():
              rows = audit.read_text(errors="replace").splitlines()[-40:]
              for raw in rows:
                  try:
                      item = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if item.get("event") not in {"max_control_webhook", "max_control_command"}:
                      continue
                  safe = {
                      "timestamp": item.get("timestamp"),
                      "event": item.get("event"),
                      "outcome": item.get("outcome"),
                      "details": item.get("details"),
                  }
                  print("AVR_MAX_AUDIT " + json.dumps(safe, ensure_ascii=False))
          code, journal = run([
              "journalctl", "-u", "avr-ai-controller.service",
              "--since", "15 minutes ago", "--no-pager", "-o", "cat",
          ])
          safe_journal = []
          for line in journal.splitlines():
              lowered = line.casefold()
              if any(word in lowered for word in ("token", "secret", "password", "authorization")):
                  continue
              safe_journal.append(line[:500])
          print("AVR_MAX_JOURNAL " + json.dumps({"exit": code, "lines": safe_journal[-40:]}, ensure_ascii=False))
          PY
