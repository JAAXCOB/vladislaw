name: Diagnose AVR AI MAX delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ai-controller-max-delivery.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only MAX identity diagnosis
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          env = {}
          for raw in Path("/opt/vladislaw/.env.ai-controller").read_text(errors="replace").splitlines():
              if "=" in raw and not raw.lstrip().startswith("#"):
                  key, value = raw.split("=", 1)
                  env[key.strip()] = value.strip()

          token = env.get("AVR_AI_MAX_CONTROL_TOKEN", "")
          chat_id = env.get("AVR_AI_MAX_CONTROL_CHAT_ID", "")
          configured = {
              value.strip()
              for value in env.get("AVR_AI_MAX_CONTROL_USER_IDS", "").split(",")
              if value.strip()
          }
          if not token or not chat_id:
              raise SystemExit("MAX token or chat id is not configured")

          url = "https://platform-api2.max.ru/chats/" + urllib.parse.quote(chat_id, safe="")
          request = urllib.request.Request(url, headers={"Authorization": token})
          with urllib.request.urlopen(request, timeout=20) as response:
              chat = json.loads(response.read())

          peer = chat.get("dialog_with_user") or {}
          peer_id = str(peer.get("user_id") or "").strip()
          result = {
              "chat_type": chat.get("type"),
              "dialog_peer_present": bool(peer_id),
              "configured_user_count": len(configured),
              "configured_user_matches_dialog_peer": bool(peer_id and peer_id in configured),
          }
          print("AVR_MAX_IDENTITY " + json.dumps(result, ensure_ascii=False))
          PY
