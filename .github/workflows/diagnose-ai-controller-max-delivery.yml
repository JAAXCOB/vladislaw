name: Diagnose AVR AI MAX delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ai-controller-max-delivery.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only MAX audit diagnosis
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import json
          from pathlib import Path

          audit = Path("/opt/vladislaw/ai-controller-data/audit.jsonl")
          events = []
          for raw in audit.read_text(errors="replace").splitlines()[-80:]:
              try:
                  item = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if item.get("event") not in {"max_control_webhook", "max_control_command"}:
                  continue
              details = item.get("details") or {}
              events.append({
                  "timestamp": item.get("timestamp"),
                  "event": item.get("event"),
                  "outcome": item.get("outcome"),
                  "chat_match": details.get("chat_match"),
                  "user_match": details.get("user_match"),
                  "processed": details.get("processed"),
              })
          print("AVR_MAX_SAFE_AUDIT " + json.dumps(events[-12:], ensure_ascii=False))
          PY
