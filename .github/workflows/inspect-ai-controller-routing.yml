name: Inspect AI controller routing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-avr-ai-controller-routing
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect controller and Caddy without changes
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD ]]
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import json, re, subprocess
          from pathlib import Path

          def run(args):
              p = subprocess.run(args, capture_output=True, text=True, timeout=15)
              return p.returncode, p.stdout.strip()

          result = {}
          for unit in ("avr-ai-controller.service", "max-webhook.service", "caddy.service"):
              result["active:" + unit] = run(["systemctl", "is-active", unit])[1]
          result["caddy_exec"] = run(["systemctl", "show", "caddy.service", "-p", "ExecStart", "--value"])[1]
          result["controller_user"] = run([
              "systemctl", "show", "avr-ai-controller.service", "-p", "User", "--value"
          ])[1]
          result["controller_health_code"] = run([
              "curl", "-sS", "-o", "/dev/null", "-w", "%{http_code}",
              "http://127.0.0.1:8010/health"
          ])[1]
          config_files = []
          base = Path("/etc/caddy")
          if base.is_dir():
              for path in sorted(base.rglob("*")):
                  if path.is_file() and not path.is_symlink() and path.stat().st_size <= 262144:
                      config_files.append(str(path))
          result["caddy_files"] = config_files
          print("AVR_ROUTE_DIAG " + json.dumps(result, ensure_ascii=False))
          safe = re.compile(r"^\s*(?:[A-Za-z0-9*_.:-]+\s*\{|handle(?:_path)?\b|route\b|reverse_proxy\b|respond\b|import\b|tls\b|}\s*$)")
          forbidden = re.compile(r"secret|token|password|authorization|api[_-]?key", re.I)
          for filename in config_files:
              print("AVR_CADDY_FILE " + filename)
              try:
                  for number, line in enumerate(Path(filename).read_text(errors="replace").splitlines(), 1):
                      if forbidden.search(line):
                          continue
                      if safe.search(line):
                          print(f"AVR_CADDY {filename}:{number}:{line[:300]}")
              except OSError:
                  pass
          env = Path("/opt/vladislaw/.env.ai-controller")
          if env.is_file():
              keys = []
              for line in env.read_text(errors="replace").splitlines():
                  if "=" in line and not line.lstrip().startswith("#"):
                      key = line.split("=", 1)[0].strip()
                      if re.fullmatch(r"AVR_AI_[A-Z0-9_]+", key):
                          keys.append(key)
              print("AVR_CONTROLLER_ENV_KEYS " + json.dumps(sorted(keys)))
          PY
