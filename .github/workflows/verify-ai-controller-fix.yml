name: Verify AVR AI controller fix

on:
  push:
    branches:
      - codex/avr-ai-controller
    paths:
      - .github/workflows/verify-ai-controller-fix.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ai-controller-test.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ai-controller-test.txt
      - run: python -m pytest -q tests/test_ai_controller.py
