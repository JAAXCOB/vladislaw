name: Collect B2B Excel recovery snapshot

on:
  push:
    branches:
      - claude/max-excel-evacuation-automation-zxuvb4
    paths:
      - ".github/workflows/excel-recovery-snapshot.yml"
      - "scripts/export_recovery_snapshot.py"
  workflow_dispatch:

concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/max-excel-evacuation-automation-zxuvb4

      - name: Collect read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            'set -euo pipefail
             cd /opt/vladislaw
             git fetch origin claude/max-excel-evacuation-automation-zxuvb4
             git checkout claude/max-excel-evacuation-automation-zxuvb4
             git merge --ff-only origin/claude/max-excel-evacuation-automation-zxuvb4
             .venv/bin/python scripts/export_recovery_snapshot.py --since 2026-09-07'
          sshpass -e scp -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST:/opt/vladislaw/data/excel-recovery-snapshot.zip" \
            excel-recovery-snapshot.zip

      - name: Upload recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: b2b-excel-recovery-snapshot
          path: excel-recovery-snapshot.zip
          retention-days: 1
          if-no-files-found: error
