name: Repair MAX closes from last 15 minutes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-all-recent-max-closes.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Replay verified close events with backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no root@130.49.173.150 'bash -se' <<'SH'
          set -euo pipefail
          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          test -n "$pid"
          test "$pid" != 0
          app_root="$(readlink -f "/proc/$pid/cwd")"
          cmd0="$(tr '\0' '\n' <"/proc/$pid/cmdline" | head -n1)"
          py="$cmd0"
          case "$(basename "$py")" in *python*) ;; *) py="$(dirname "$cmd0")/python" ;; esac
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="/opt/vladislaw/backups/all-recent-closes-$stamp"
          install -d -m 0700 "$backup"
          "$py" - "$pid" "$app_root" "$backup" <<'PY'
          import json, os, shutil, sys, time
          from pathlib import Path
          import httpx

          pid, app_root, backup_dir = sys.argv[1:]
          os.chdir(app_root)
          sys.path.insert(0, app_root)
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  os.environ[key.decode(errors="ignore")] = value.decode(errors="ignore")

          from scripts.daily_import import fetch_all_messages
          from webhook.config import settings
          from webhook.main import process_message
          from webhook.models import Message
          from webhook.reporting_rules import is_bot_generated_message, parse_explicit_closed_report, report_is_writable

          now_ms = int(time.time() * 1000)
          oldest_ms = now_ms - 15 * 60 * 1000
          candidates = {}
          with httpx.Client(timeout=30, verify="/etc/ssl/certs/ca-certificates.crt") as client:
              for chat_id in sorted(settings.allowed_chat_ids):
                  for raw in fetch_all_messages(client, chat_id, oldest_ms, now_ms):
                      msg = Message.model_validate(raw)
                      text = msg.resolve_text() or ""
                      mid = msg.body.mid if msg.body else None
                      if not mid or not text or is_bot_generated_message(text, bool(msg.sender and msg.sender.is_bot)):
                          continue
                      job = parse_explicit_closed_report(text)
                      if job and report_is_writable(job):
                          candidates[(str(chat_id), mid)] = (int(raw.get("timestamp") or 0), chat_id, msg, text)

          backup = Path(backup_dir)
          protected = []
          for label, value in (("excel", settings.excel_file_path), ("payroll", settings.payroll_file_path)):
              path = Path(value) if value else None
              if path and path.is_file():
                  destination = backup / f"{label}{path.suffix}"
                  shutil.copy2(path, destination)
                  protected.append((path, destination))

          replayed = 0
          source_ids = set()
          try:
              for timestamp_ms, chat_id, msg, text in sorted(candidates.values(), key=lambda item: item[0]):
                  mid = msg.body.mid
                  process_message(
                      text,
                      msg.sender.display_name if msg.sender else "unknown",
                      msg.effective_sender_name(),
                      timestamp_ms,
                      int(chat_id),
                      mid,
                      False,
                  )
                  source_ids.add(f"max:{chat_id}:{mid}")
                  replayed += 1
          except Exception:
              for path, saved in protected:
                  shutil.copy2(saved, path)
              raise

          queue_path = Path(settings.av_rescue_sync_queue_path)
          if not queue_path.is_absolute():
              queue_path = Path(app_root) / queue_path
          pending = 0
          dead = 0
          for path, bucket in ((queue_path, "pending"), (queue_path.with_name(queue_path.stem + ".dead" + queue_path.suffix), "dead")):
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              for item in data if isinstance(data, list) else []:
                  payload = item.get("payload", item) if isinstance(item, dict) else {}
                  if payload.get("source_id") in source_ids and payload.get("event") == "close":
                      if bucket == "pending": pending += 1
                      else: dead += 1

          if pending or dead:
              raise SystemExit("one or more verified closes were not delivered")
          print("REPAIR_ALL_RECENT_CLOSES " + json.dumps({
              "verified_close_events": len(candidates),
              "replayed": replayed,
              "delivery_queue_clear": True,
              "backup_created": True,
              "webhook_active": os.system("systemctl is-active --quiet max-webhook.service") == 0,
              "timer_active": os.system("systemctl is-active --quiet max-order-reconcile.timer") == 0,
          }))
          PY
          SH

