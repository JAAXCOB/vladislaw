name: Verify AVR AI MAX outbound connection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-ai-max-outbound.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify read-only MAX API connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'sudo -u avrai /opt/vladislaw/ai-controller/current/.venv/bin/python -B -' <<'PY'
          import ssl
          from pathlib import Path
          import httpx

          env = {}
          for raw in Path("/opt/vladislaw/.env.ai-controller").read_text(errors="replace").splitlines():
              if "=" in raw and not raw.lstrip().startswith("#"):
                  key, value = raw.split("=", 1)
                  env[key.strip()] = value.strip()
          token = env.get("AVR_AI_MAX_CONTROL_TOKEN", "")
          if not token:
              raise SystemExit("MAX controller token is not configured")
          with httpx.Client(timeout=20, verify=ssl.create_default_context()) as client:
              response = client.get(
                  "https://platform-api2.max.ru/me",
                  headers={"Authorization": token},
              )
          print("MAX_READ_ONLY_STATUS=" + str(response.status_code))
          if response.status_code != 200:
              raise SystemExit("MAX read-only verification failed")
          PY
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 \
            'test "$(systemctl is-active avr-ai-controller.service)" = active && test "$(systemctl is-active max-webhook.service)" = active'
