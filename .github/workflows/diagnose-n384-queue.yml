name: Diagnose queued N384 delivery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-n384-queue.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Return safe queue and endpoint diagnostics
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20 root@130.49.173.150 'python3 -B -' <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          TARGET = "Н384РТ797"

          def norm(value):
              table = str.maketrans({"A":"А","B":"В","C":"С","E":"Е","H":"Н","K":"К","M":"М","O":"О","P":"Р","T":"Т","X":"Х","Y":"У"})
              return re.sub(r"[^А-Я0-9]", "", str(value).upper().replace("Ё", "Е").translate(table))

          pid = int(subprocess.run(
              ["systemctl", "show", "max-webhook.service", "-p", "MainPID", "--value"],
              capture_output=True, text=True, check=True,
          ).stdout.strip() or "0")
          env = {}
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  env[key.decode(errors="ignore")] = value.decode(errors="ignore")
          cwd = Path(os.readlink(f"/proc/{pid}/cwd"))
          cmdline = [x.decode(errors="ignore") for x in Path(f"/proc/{pid}/cmdline").read_bytes().split(b"\0") if x]
          executable = Path(cmdline[0])
          if "python" not in executable.name.casefold():
              executable = executable.parent / "python"

          queue_value = env.get("AV_RESCUE_SYNC_QUEUE_PATH", "data/av_rescue_sync_queue.json")
          queue = Path(queue_value)
          if not queue.is_absolute():
              queue = cwd / queue
          dead = queue.with_name(queue.stem + ".dead" + queue.suffix)
          matched = None
          location = "none"
          for label, path in (("pending", queue), ("dead", dead)):
              try:
                  records = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for record in records if isinstance(records, list) else []:
                  payload = record.get("payload", record) if isinstance(record, dict) else {}
                  if norm(TARGET) in norm(payload.get("license_plate", "")):
                      matched = record
                      location = label

          payload = (matched or {}).get("payload", matched or {})
          queue_summary = {
              "found": matched is not None,
              "location": location,
              "attempts": int((matched or {}).get("attempts", 0)),
              "retry_due": int((matched or {}).get("next_attempt_at", 0)) <= int(time.time()),
              "has_stable_source_id": str(payload.get("source_id", "")).startswith("max:"),
              "event_is_upsert": payload.get("event") == "upsert",
              "has_plate": bool(payload.get("license_plate")),
              "has_pickup": bool(payload.get("pickup_address")),
              "has_destination": bool(payload.get("destination")),
              "has_vehicle": bool(payload.get("vehicle")),
              "has_phone": bool(payload.get("phone")),
              "comment_length": len(str(payload.get("comment") or "")),
          }

          child_env = dict(env)
          child_env["PYTHONPATH"] = str(cwd) + os.pathsep + child_env.get("PYTHONPATH", "")
          probe_code = r'''
          import json, os, ssl
          import httpx
          url = os.environ.get("AV_RESCUE_API_URL", "")
          result = {}
          for label, verify in (
              ("default_ca", True),
              ("system_ca", ssl.create_default_context()),
          ):
              try:
                  with httpx.Client(timeout=15, verify=verify, follow_redirects=False) as client:
                      response = client.get(url)
                  result[label] = {"connected": True, "http_status": response.status_code}
              except Exception as exc:
                  result[label] = {"connected": False, "error_type": type(exc).__name__}
          print(json.dumps(result))
          '''
          probe = subprocess.run(
              [str(executable), "-c", probe_code], cwd=cwd, env=child_env,
              capture_output=True, text=True, timeout=60,
          )
          endpoint = {}
          if probe.returncode == 0 and probe.stdout.strip():
              endpoint = json.loads(probe.stdout.strip().splitlines()[-1])

          print("APPROVED_N384_QUEUE " + json.dumps({
              "queue": queue_summary,
              "endpoint": endpoint,
              "max_webhook_active": subprocess.run(
                  ["systemctl", "is-active", "--quiet", "max-webhook.service"]
              ).returncode == 0,
          }, ensure_ascii=False))
          PY
