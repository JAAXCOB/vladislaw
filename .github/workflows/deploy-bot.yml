name: Deploy MAX bot safely

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
      python_version:
        description: Must match python3 major.minor on IHC
        required: true
        default: "3.12"
        type: string
      deploy_to_production:
        description: Activate on production after tests (also requires environment approval)
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify immutable revision
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_REF"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pytest -q
          bash -n ops/bin/avr-max-deploy
          bash -n ops/sbin/avr-max-restart
          bash -n ops/sbin/avr-max-excel-restore

      - name: Build offline release bundle
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(git rev-parse HEAD)"
          mkdir -p build/release/wheelhouse
          python -m pip download --disable-pip-version-check \
            --only-binary=:all: \
            --dest build/release/wheelhouse \
            -r requirements.txt
          cp -a .github ops .env.ai-controller.example \
            ai_controller webhook scripts tests requirements.txt \
            requirements-ai-controller.txt build/release/
          printf '%s\n' "$release_id" > build/release/RELEASE_ID
          python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" \
            > build/release/PYTHON_VERSION
          tar -C build/release -czf "build/max-bot-${release_id}.tar.gz" .
          sha256sum "build/max-bot-${release_id}.tar.gz" > "build/max-bot-${release_id}.tar.gz.sha256"
          printf 'RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Upload tested release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: max-bot-${{ env.RELEASE_ID }}
          path: |
            build/max-bot-${{ env.RELEASE_ID }}.tar.gz
            build/max-bot-${{ env.RELEASE_ID }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: ${{ inputs.deploy_to_production }}
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-max
    steps:
      - name: Download tested release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: max-bot-*
          merge-multiple: true
          path: release

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate tested release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MAX_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          bundle="$(find release -maxdepth 1 -type f -name 'max-bot-*.tar.gz' -print -quit)"
          test -n "$bundle"
          checksum="$(sha256sum "$bundle" | awk '{print $1}')"
          release_id="${bundle##*/max-bot-}"
          release_id="${release_id%.tar.gz}"
          case "$release_id" in
            (*[!0-9a-f]*|'') echo "Invalid release id" >&2; exit 2 ;;
          esac
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${ssh_options[@]}" "$bundle" \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/vladislaw/.deploy/incoming/max-bot-${release_id}.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "/usr/local/bin/avr-max-deploy '$release_id' '$checksum'"
