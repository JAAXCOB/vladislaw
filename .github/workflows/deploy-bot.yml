name: Deploy MAX bot

on:
  push:
    branches:
      - claude/max-excel-evacuation-automation-zxuvb4
    paths:
      - "webhook/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Deploy current branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_PASSWORD" ]; then
            echo "Auto-deploy is not configured: add SERVER_HOST, SERVER_USER and SERVER_PASSWORD secrets."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASSWORD"

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'set -euo pipefail
             cd /opt/vladislaw
             git fetch origin claude/max-excel-evacuation-automation-zxuvb4
             git checkout claude/max-excel-evacuation-automation-zxuvb4
             git merge --ff-only origin/claude/max-excel-evacuation-automation-zxuvb4

             export DEBIAN_FRONTEND=noninteractive
             apt-get update -qq
             apt-get install -y -qq python3-venv python3-pip curl
             python3 -m venv .venv
             .venv/bin/python -m pip install --upgrade pip
             .venv/bin/pip install -r requirements.txt

             install -d -m 0755 /opt/vladislaw/data/excel
             cat > /etc/systemd/system/max-webhook.service <<EOF
[Unit]
Description=MAX webhook receiver for AV Rescue
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
WorkingDirectory=/opt/vladislaw
EnvironmentFile=/opt/vladislaw/.env
ExecStart=/opt/vladislaw/.venv/bin/uvicorn webhook.main:app --host 127.0.0.1 --port 8000
Restart=always
RestartSec=5
TimeoutStopSec=20

[Install]
WantedBy=multi-user.target
EOF

             systemctl daemon-reload
             systemctl enable max-webhook.service
             systemctl restart max-webhook.service

             for attempt in 1 2 3 4 5 6; do
               if curl -fsS http://127.0.0.1:8000/health; then
                 break
               fi
               if [ "$attempt" -eq 6 ]; then
                 systemctl status max-webhook.service --no-pager -l || true
                 journalctl -u max-webhook.service --no-pager -n 120 || true
                 exit 1
               fi
               sleep 2
             done

             .venv/bin/python scripts/register_webhook.py
             systemctl status max-webhook.service --no-pager -l'
