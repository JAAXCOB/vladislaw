name: Check MAX orders at 2026-10-16 20-22 and 20-32 MSK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-max-orders-20261016.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Return time-window summary only
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20 root@130.49.173.150 'python3 -B -' <<'PY'
          import datetime
          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          def run(args):
              return subprocess.run(args, capture_output=True, text=True, timeout=40)

          pid = int(run(["systemctl", "show", "max-webhook.service", "-p", "MainPID", "--value"]).stdout.strip() or "0")
          env = {}
          if pid:
              for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                  if b"=" in raw:
                      key, value = raw.split(b"=", 1)
                      env[key.decode(errors="ignore")] = value.decode(errors="ignore")

          token = env.get("MAX_BOT_TOKEN", "")
          base = env.get("MAX_API_BASE", "https://platform-api2.max.ru").rstrip("/")
          chat_ids = [x.strip() for x in env.get("MAX_CHAT_ID", "").split(",") if x.strip()]
          plate_pattern = re.compile(r"[А-ЯA-Z]\s*\d{3}\s*[А-ЯA-Z]{2}\s*\d{2,3}", re.I)
          windows = {
              "20:22": (
                  datetime.datetime(2026, 10, 16, 17, 20, tzinfo=datetime.timezone.utc),
                  datetime.datetime(2026, 10, 16, 17, 25, tzinfo=datetime.timezone.utc),
              ),
              "20:32": (
                  datetime.datetime(2026, 10, 16, 17, 30, tzinfo=datetime.timezone.utc),
                  datetime.datetime(2026, 10, 16, 17, 35, tzinfo=datetime.timezone.utc),
              ),
          }
          result = {
              key: {"messages_in_chat": 0, "plate_like_messages": 0}
              for key in windows
          }
          read_ok = False
          try:
              for chat_id in chat_ids:
                  query = urllib.parse.urlencode({"chat_id": chat_id, "count": 100})
                  request = urllib.request.Request(base + "/messages?" + query, headers={"Authorization": token})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      messages = json.loads(response.read()).get("messages") or []
                      read_ok = response.status == 200
                  for message in messages:
                      ts = int(message.get("timestamp") or 0)
                      dt = datetime.datetime.fromtimestamp(ts / 1000, tz=datetime.timezone.utc)
                      text = str((message.get("body") or {}).get("text") or "")
                      for key, (start, end) in windows.items():
                          if start <= dt <= end:
                              result[key]["messages_in_chat"] += 1
                              if plate_pattern.search(text):
                                  result[key]["plate_like_messages"] += 1
          except Exception:
              pass

          journal = run([
              "journalctl", "-u", "max-webhook.service",
              "--since", "2026-10-16 17:20:00 UTC",
              "--until", "2026-10-16 17:35:59 UTC",
              "--no-pager", "-o", "short-iso"
          ]).stdout
          for key, (start, end) in windows.items():
              lines = []
              for line in journal.splitlines():
                  try:
                      stamp = datetime.datetime.fromisoformat(line[:25])
                  except Exception:
                      continue
                  if start <= stamp.astimezone(datetime.timezone.utc) <= end:
                      lines.append(line)
              segment = "\n".join(lines)
              result[key]["webhook_message_events"] = len(re.findall(r"MESSAGE_CREATED\s*\||UPDATE type=message_created", segment))
              result[key]["site_sync_delivered"] = segment.count("AV Rescue sync delivered")
              result[key]["site_sync_errors"] = segment.count("AV Rescue sync request failed") + segment.count("AV Rescue sync failed: HTTP")

          print("APPROVED_TIME_CHECK " + json.dumps({
              "read_ok": read_ok,
              "service_active": run(["systemctl", "is-active", "max-webhook.service"]).stdout.strip() == "active",
              "windows_msk": result,
          }, ensure_ascii=False))
          PY
