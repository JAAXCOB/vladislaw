name: Diagnose one MAX order sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-one-max-order.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Return only approved MAX presence and error class
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import datetime
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          approved_plate = "А742ОО797"
          latin_plate = "A742OO797"

          def normalized(value):
              return re.sub(r"[^A-ZА-Я0-9]", "", str(value).upper().replace("Ё", "Е"))

          def contains_plate(value):
              text = normalized(value)
              return normalized(approved_plate) in text or latin_plate in text

          def run(args):
              return subprocess.run(args, capture_output=True, text=True, timeout=30)

          pid = int(run([
              "systemctl", "show", "max-webhook.service", "-p", "MainPID", "--value"
          ]).stdout.strip() or "0")
          env = {}
          if pid:
              for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                  if b"=" in raw:
                      key, value = raw.split(b"=", 1)
                      env[key.decode(errors="ignore")] = value.decode(errors="ignore")

          token = env.get("MAX_BOT_TOKEN", "")
          api_base = env.get("MAX_API_BASE", "https://platform-api2.max.ru").rstrip("/")
          chat_ids = [
              item.strip()
              for item in env.get("MAX_CHAT_ID", "").split(",")
              if item.strip()
          ]
          found = False
          found_timestamp_ms = 0
          api_error = False
          for chat_id in chat_ids:
              try:
                  query = urllib.parse.urlencode({"chat_id": chat_id, "count": 100})
                  request = urllib.request.Request(
                      api_base + "/messages?" + query,
                      headers={"Authorization": token},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      messages = json.loads(response.read()).get("messages") or []
                  for message in messages:
                      text = str((message.get("body") or {}).get("text") or "")
                      if contains_plate(text):
                          found = True
                          found_timestamp_ms = int(message.get("timestamp") or 0)
                          break
              except Exception:
                  api_error = True
              if found:
                  break

          error_type = "none_observed"
          if api_error and not found:
              error_type = "max_read_error"
          elif not found:
              error_type = "not_in_allowed_max_chat"
          elif found_timestamp_ms:
              stamp = datetime.datetime.fromtimestamp(
                  found_timestamp_ms / 1000, tz=datetime.timezone.utc
              )
              since = (stamp - datetime.timedelta(minutes=2)).isoformat()
              until = (stamp + datetime.timedelta(minutes=2)).isoformat()
              journal = run([
                  "journalctl", "-u", "max-webhook.service",
                  "--since", since, "--until", until, "--no-pager", "-o", "cat",
              ]).stdout
              if "AV Rescue sync request failed" in journal:
                  error_type = "site_connection_error_at_message_time"
              elif "AV Rescue sync failed: HTTP" in journal:
                  error_type = "site_http_error_at_message_time"
              elif "Rejected unsupported/invalid update" in journal:
                  error_type = "invalid_webhook_update_at_message_time"
              elif "UPDATE type=message_created" not in journal:
                  error_type = "webhook_not_received_at_message_time"
              elif "AV Rescue sync delivered" not in journal:
                  error_type = "message_received_but_not_classified_for_site"
              else:
                  error_type = "sync_reported_delivered"

          print("APPROVED_MAX_TRACE " + json.dumps({
              "found_in_allowed_max_chat": bool(found),
              "error_type": error_type,
          }, ensure_ascii=False))
          PY
