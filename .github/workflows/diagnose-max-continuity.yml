name: Diagnose MAX webhook continuity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-max-continuity.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Return approved continuity summary only
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import datetime
          import json
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          TARGET = "А742ОО797"
          LATIN = "A742OO797"

          def run(args):
              return subprocess.run(args, capture_output=True, text=True, timeout=40)

          def service_env(name):
              pid_text = run(["systemctl", "show", name, "-p", "MainPID", "--value"]).stdout.strip()
              pid = int(pid_text or "0")
              result = {}
              if pid:
                  try:
                      for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                          if b"=" in raw:
                              key, value = raw.split(b"=", 1)
                              result[key.decode(errors="ignore")] = value.decode(errors="ignore")
                  except Exception:
                      pass
              return pid, result

          def norm(value):
              return re.sub(r"[^A-ZА-Я0-9]", "", str(value).upper().replace("Ё", "Е"))

          operational_pid, env = service_env("max-webhook.service")
          controller_pid, controller_env = service_env("avr-ai-controller.service")
          operational_token = env.get("MAX_BOT_TOKEN", "")
          controller_token = controller_env.get("AVR_AI_MAX_CONTROL_TOKEN", "")
          api_base = env.get("MAX_API_BASE", "https://platform-api2.max.ru").rstrip("/")
          expected_url = env.get("MAX_WEBHOOK_URL", "")
          chat_ids = [x.strip() for x in env.get("MAX_CHAT_ID", "").split(",") if x.strip()]
          bot_id = 0
          endpoint_status = "not_configured"
          caddy_active = run(["systemctl", "is-active", "caddy.service"]).stdout.strip() == "active"

          def api_get(path, query=None):
              url = api_base + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers={"Authorization": operational_token})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status, json.loads(response.read())

          subscriptions_ok = False
          subscription_count = 0
          expected_url_found = False
          message_created_enabled = False
          subscription_error = "none"
          try:
              status, payload = api_get("/subscriptions")
              subscriptions_ok = status == 200
              subscriptions = payload.get("subscriptions") or []
              subscription_count = len(subscriptions)
              expected_url_found = bool(expected_url) and any(s.get("url") == expected_url for s in subscriptions)
              relevant = [s for s in subscriptions if not expected_url or s.get("url") == expected_url]
              message_created_enabled = any(
                  s.get("update_types") is None
                  or isinstance(s.get("update_types"), list) and "message_created" in s.get("update_types")
                  for s in relevant
              )
          except Exception as exc:
              subscription_error = type(exc).__name__

          try:
              _, me_payload = api_get("/me")
              bot_id = int(me_payload.get("user_id") or 0)
          except Exception:
              pass
          if expected_url:
              try:
                  request = urllib.request.Request(expected_url, method="GET")
                  with urllib.request.urlopen(request, timeout=20) as response:
                      endpoint_status = f"http_{response.status}"
              except urllib.error.HTTPError as exc:
                  endpoint_status = f"http_{exc.code}"
              except Exception as exc:
                  endpoint_status = type(exc).__name__

          target_ts = 0
          target_sender_category = "unknown"
          later_messages = 0
          later_plate_like_messages = 0
          later_plate_sender_categories = set()
          messages_read_ok = False
          plate_pattern = re.compile(r"[А-ЯA-Z]\s*\d{3}\s*[А-ЯA-Z]{2}\s*\d{2,3}", re.I)
          try:
              all_messages = []
              for chat_id in chat_ids:
                  status, payload = api_get("/messages", {"chat_id": chat_id, "count": 100})
                  messages_read_ok = messages_read_ok or status == 200
                  all_messages.extend(payload.get("messages") or [])
              for message in all_messages:
                  text = str((message.get("body") or {}).get("text") or "")
                  if norm(TARGET) in norm(text) or LATIN in norm(text):
                      candidate_ts = int(message.get("timestamp") or 0)
                      if candidate_ts >= target_ts:
                          target_ts = candidate_ts
                          sender = message.get("sender") or {}
                          sender_id = int(sender.get("user_id") or 0)
                          target_sender_category = (
                              "operational_bot" if bot_id and sender_id == bot_id
                              else "other_bot" if sender.get("is_bot") is True
                              else "human_or_unmarked"
                          )
              if target_ts:
                  for message in all_messages:
                      ts = int(message.get("timestamp") or 0)
                      if ts > target_ts:
                          later_messages += 1
                          text = str((message.get("body") or {}).get("text") or "")
                          if plate_pattern.search(text):
                              later_plate_like_messages += 1
                              sender = message.get("sender") or {}
                              sender_id = int(sender.get("user_id") or 0)
                              later_plate_sender_categories.add(
                                  "operational_bot" if bot_id and sender_id == bot_id
                                  else "other_bot" if sender.get("is_bot") is True
                                  else "human_or_unmarked"
                              )
          except Exception:
              pass

          since = "24 hours ago"
          target_iso = None
          if target_ts:
              target_dt = datetime.datetime.fromtimestamp(target_ts / 1000, tz=datetime.timezone.utc)
              target_iso = target_dt.isoformat()
              since = target_iso

          journal = run([
              "journalctl", "-u", "max-webhook.service", "--since", since,
              "--no-pager", "-o", "cat"
          ]).stdout
          webhook_events_after = len(re.findall(r"MESSAGE_CREATED\s*\||UPDATE type=message_created", journal))
          sync_delivered_after = journal.count("AV Rescue sync delivered")
          site_request_errors_after = (
              journal.count("AV Rescue sync request failed")
              + journal.count("AV Rescue sync failed: HTTP")
          )
          invalid_secret_after = journal.count("invalid X-Max-Bot-Api-Secret")
          target_seen_in_journal = norm(TARGET) in norm(journal) or LATIN in norm(journal)

          service = {
              "active": run(["systemctl", "is-active", "max-webhook.service"]).stdout.strip() == "active",
              "restart_count": int(run([
                  "systemctl", "show", "max-webhook.service", "-p", "NRestarts", "--value"
              ]).stdout.strip() or "0"),
              "active_since": run([
                  "systemctl", "show", "max-webhook.service",
                  "-p", "ActiveEnterTimestamp", "--value"
              ]).stdout.strip(),
          }

          print("APPROVED_CONTINUITY " + json.dumps({
              "operational_webhook": {
                  "service_active": service["active"],
                  "restart_count": service["restart_count"],
                  "active_since_present": bool(service["active_since"]),
                  "started_before_target": bool(
                      target_ts and service["active_since"]
                      and datetime.datetime.strptime(
                          service["active_since"].split(" UTC")[0], "%a %Y-%m-%d %H:%M:%S"
                      ).replace(tzinfo=datetime.timezone.utc).timestamp() * 1000 < target_ts
                  ),
                  "process_present": operational_pid > 0,
              },
              "controller_is_separate": {
                  "process_present": controller_pid > 0,
                  "both_tokens_present": bool(operational_token and controller_token),
                  "tokens_are_different": bool(
                      operational_token and controller_token and operational_token != controller_token
                  ),
              },
              "public_route": {
                  "caddy_active": caddy_active,
                  "endpoint_get_status": endpoint_status,
              },
              "subscription": {
                  "read_ok": subscriptions_ok,
                  "error_type": subscription_error,
                  "count": subscription_count,
                  "expected_url_configured": bool(expected_url),
                  "expected_url_found": expected_url_found,
                  "message_created_enabled": message_created_enabled,
              },
              "after_missing_order": {
                  "target_found_in_chat": bool(target_ts),
                  "target_sender_category": target_sender_category,
                  "target_seen_by_webhook": target_seen_in_journal,
                  "messages_read_ok": messages_read_ok,
                  "later_messages_in_chat": later_messages,
                  "later_plate_like_messages": later_plate_like_messages,
                  "later_plate_sender_categories": sorted(later_plate_sender_categories),
                  "webhook_message_events": webhook_events_after,
                  "site_sync_delivered": sync_delivered_after,
                  "site_sync_errors": site_request_errors_after,
                  "invalid_secret_requests": invalid_secret_after,
              },
          }, ensure_ascii=False))
          PY
