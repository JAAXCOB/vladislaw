name: Build AVR Android Release 2.3.4 / Client 1.0.3

on:
  push:
    branches: [ avr-android-build-233 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore source
        run: |
          base64 -d ci/avr-android-source.tgz.b64 > /tmp/avr-android.tgz
          tar -xzf /tmp/avr-android.tgz
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Driver release
        run: |
          set +e
          cd AVRescueAndroid
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon > ../driver-build.log 2>&1
          echo $? > ../driver-exit
          exit 0
      - name: Build Client release
        run: |
          set +e
          cd AVRescueClientAndroid
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon > ../client-build.log 2>&1
          echo $? > ../client-exit
          exit 0
      - name: Report build result
        run: |
          echo '## Driver release build' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 driver-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Client release build' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 client-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$(cat driver-exit)" != 0 ]; then
            message=$(grep -E 'error:|FAILURE:|What went wrong|Could not|failed' driver-build.log | tail -20 | tr '\n' ' ')
            echo "::error title=Driver release build::$message"
            exit 1
          fi
          if [ "$(cat client-exit)" != 0 ]; then
            message=$(grep -E 'error:|FAILURE:|What went wrong|Could not|failed' client-build.log | tail -20 | tr '\n' ' ')
            echo "::error title=Client release build::$message"
            exit 1
          fi
      - name: Collect unsigned release APKs and signing tool
        run: |
          mkdir artifacts
          cp AVRescueAndroid/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/AVR_Driver_2.3.4_unsigned.apk
          cp AVRescueClientAndroid/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/AV_Rescue_Client_1.0.3_unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" artifacts/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AV-Rescue-Android-Release-2.3.4-Client-1.0.3
          path: artifacts/*
          retention-days: 30
