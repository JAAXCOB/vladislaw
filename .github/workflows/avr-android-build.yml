name: Build AVR Driver 3.24

on:
  push:
    branches: [ codex/android-driver-3.24 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release contract
        run: python -m unittest tests.test_android_driver_324
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Driver APK and AAB
        working-directory: AVRescueAndroid
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug assembleRelease bundleRelease --no-daemon
      - name: Collect artifacts
        run: |
          mkdir artifacts
          cp AVRescueAndroid/app/build/outputs/apk/debug/app-debug.apk artifacts/AVR_Driver_3.24-test.apk
          cp AVRescueAndroid/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/AVR_Driver_3.24-release-unsigned.apk
          cp AVRescueAndroid/app/build/outputs/bundle/release/app-release.aab artifacts/AVR_Driver_3.24-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: AVR-Driver-3.24-build-324
          path: artifacts/*
          retention-days: 30
