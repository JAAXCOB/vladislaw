name: Build AVR Android 2.3.3

on:
  push:
    branches: [ avr-android-build-233 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore source
        run: |
          base64 -d ci/avr-android-source.tgz.b64 > /tmp/avr-android.tgz
          tar -xzf /tmp/avr-android.tgz
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Driver
        run: |
          set +e
          cd AVRescueAndroid
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon > ../driver-build.log 2>&1
          echo $? > ../driver-exit
          exit 0
      - name: Build Client
        run: |
          set +e
          cd AVRescueClientAndroid
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon > ../client-build.log 2>&1
          echo $? > ../client-exit
          exit 0
      - name: Report build result
        run: |
          echo '## Driver build' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 driver-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Client build' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 client-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$(cat driver-exit)" != 0 ]; then
            message=$(grep -E 'error:|FAILURE:|What went wrong|Could not|failed' driver-build.log | tail -20 | tr '\n' ' ')
            echo "::error title=Driver build::$message"
            exit 1
          fi
          if [ "$(cat client-exit)" != 0 ]; then
            message=$(grep -E 'error:|FAILURE:|What went wrong|Could not|failed' client-build.log | tail -20 | tr '\n' ' ')
            echo "::error title=Client build::$message"
            exit 1
          fi
      - name: Collect APKs
        run: |
          mkdir artifacts
          cp AVRescueAndroid/app/build/outputs/apk/debug/app-debug.apk artifacts/AVR_Driver_2.3.3.apk
          cp AVRescueClientAndroid/app/build/outputs/apk/debug/app-debug.apk artifacts/AV_Rescue_Client_1.0.1.apk
      - name: Save APK delivery files
        run: |
          mkdir -p ci/apks
          base64 -w0 artifacts/AVR_Driver_2.3.3.apk > ci/apks/AVR_Driver_2.3.3.apk.b64
          base64 -w0 artifacts/AV_Rescue_Client_1.0.1.apk > ci/apks/AV_Rescue_Client_1.0.1.apk.b64
          git config user.name avr-build
          git config user.email avrdriver@yandex.ru
          git add ci/apks
          git commit -m '[skip ci] Save AVR Android 2.3.3 APKs'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: AV-Rescue-Android-2.3.3
          path: artifacts/*.apk
          retention-days: 30
