name: Build AVR Android 2.3.3

on:
  push:
    branches: [ avr-android-build-233 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore source
        run: |
          base64 -d ci/avr-android-source.tgz.b64 > /tmp/avr-android.tgz
          tar -xzf /tmp/avr-android.tgz
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Driver
        run: |
          set +e
          cd AVRescueAndroid
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon > ../driver-build.log 2>&1
          echo $? > ../driver-exit
          exit 0
      - name: Build Client
        run: |
          set +e
          cd AVRescueClientAndroid
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon > ../client-build.log 2>&1
          echo $? > ../client-exit
          exit 0
      - name: Publish diagnostics on failure
        run: |
          if [ "$(cat driver-exit)" != 0 ] || [ "$(cat client-exit)" != 0 ]; then
            git config user.name avr-build
            git config user.email avrdriver@yandex.ru
            mkdir -p ci/build-logs
            cp driver-build.log client-build.log ci/build-logs/
            git add ci/build-logs
            git commit -m '[skip ci] Save Android build diagnostics'
            git push
            exit 1
          fi
      - name: Collect APKs
        run: |
          mkdir artifacts
          cp AVRescueAndroid/app/build/outputs/apk/debug/app-debug.apk artifacts/AVR_Driver_2.3.3.apk
          cp AVRescueClientAndroid/app/build/outputs/apk/debug/app-debug.apk artifacts/AV_Rescue_Client_1.0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AV-Rescue-Android-2.3.3
          path: artifacts/*.apk
          retention-days: 30
