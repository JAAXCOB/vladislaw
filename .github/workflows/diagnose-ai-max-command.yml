name: Diagnose AVR AI MAX command

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ai-max-command.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Classify recent controller exceptions
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@130.49.173.150 'python3 -B -' <<'PY'
          import json
          import subprocess

          journal = subprocess.run(
              ["journalctl", "-u", "avr-ai-controller.service", "--since", "25 minutes ago",
               "--no-pager", "-o", "cat"],
              capture_output=True, text=True, timeout=20,
          ).stdout
          needles = [
              "httpx.ConnectError", "httpx.ConnectTimeout", "httpx.ReadTimeout",
              "httpx.RemoteProtocolError", "RuntimeError", "AttributeError",
              "TypeError", "KeyError", "ValueError", "sqlite3.",
              "in _send", "in handle_command", "in process_update",
              "in max_control_webhook",
          ]
          print("AVR_MAX_EXCEPTION_CLASSES " + json.dumps(
              {needle: journal.count(needle) for needle in needles},
              ensure_ascii=False,
          ))
          PY
