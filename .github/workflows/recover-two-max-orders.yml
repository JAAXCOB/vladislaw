name: Recover only A742OO797 safely

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-two-max-orders.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/max-order-reconciliation-20261016
      - name: Dry-run then recover only A742
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          stage=/tmp/avr-reconcile-stage-${GITHUB_RUN_ID}
          tar -czf /tmp/avr-reconcile-stage.tgz scripts/reconcile_new_orders.py webhook
          sshpass -e ssh -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@130.49.173.150 "install -d -m 0700 '$stage'"
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/avr-reconcile-stage.tgz root@130.49.173.150:"$stage/package.tgz"
          sshpass -e ssh -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@130.49.173.150 "tar -xzf '$stage/package.tgz' -C '$stage'"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20 root@130.49.173.150 "REMOTE_ROOT='$stage' REMOTE_SCRIPT='$stage/scripts/reconcile_new_orders.py' python3 -B -" <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          TARGET = "А742ОО797"

          def digest(value):
              path = Path(value) if value else None
              if not path or not path.is_file():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def norm(value):
              table = str.maketrans({"A":"А","B":"В","C":"С","E":"Е","H":"Н","K":"К","M":"М","O":"О","P":"Р","T":"Т","X":"Х","Y":"У"})
              return re.sub(r"[^А-Я0-9]", "", str(value).upper().replace("Ё", "Е").translate(table))

          pid = int(subprocess.run(
              ["systemctl", "show", "max-webhook.service", "-p", "MainPID", "--value"],
              capture_output=True, text=True, check=True,
          ).stdout.strip() or "0")
          env = {}
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  env[key.decode(errors="ignore")] = value.decode(errors="ignore")
          cwd = Path(os.readlink(f"/proc/{pid}/cwd"))
          cmdline = [x.decode(errors="ignore") for x in Path(f"/proc/{pid}/cmdline").read_bytes().split(b"\0") if x]
          executable = Path(cmdline[0])
          if "python" not in executable.name.casefold():
              executable = executable.parent / "python"
          child_env = dict(env)
          child_env["PYTHONPATH"] = os.environ["REMOTE_ROOT"] + os.pathsep + str(cwd) + os.pathsep + child_env.get("PYTHONPATH", "")

          queue_value = env.get("AV_RESCUE_SYNC_QUEUE_PATH", "data/av_rescue_sync_queue.json")
          queue = Path(queue_value)
          if not queue.is_absolute():
              queue = cwd / queue
          dead = queue.with_name(queue.stem + ".dead" + queue.suffix)
          child_env["AV_RESCUE_SYNC_QUEUE_PATH"] = str(queue)
          backup = Path("/opt/vladislaw/backups") / ("a742-replay-" + time.strftime("%Y%m%dT%H%M%SZ", time.gmtime()))
          backup.mkdir(parents=True, mode=0o700)
          for path in (queue, dead):
              if path.exists():
                  shutil.copy2(path, backup / path.name)

          before = {
              "excel": digest(env.get("EXCEL_FILE_PATH")),
              "payroll": digest(env.get("PAYROLL_FILE_PATH")),
          }
          base_command = [
              str(executable), os.environ["REMOTE_SCRIPT"], "--hours", "6",
              "--only-plate", TARGET,
          ]
          dry = subprocess.run(
              base_command + ["--dry-run"], cwd=cwd, env=child_env,
              capture_output=True, text=True, timeout=180,
          )
          dry_summary = {}
          if dry.returncode == 0 and dry.stdout.strip():
              dry_summary = json.loads(dry.stdout.strip().splitlines()[-1])
          if dry.returncode != 0 or dry_summary.get("new_orders") != 1:
              print("APPROVED_A742_RECOVERY " + json.dumps({
                  "ok": False, "stage": "dry_run", "classified": int(dry_summary.get("new_orders", 0))
              }))
              raise SystemExit(1)

          actual = subprocess.run(
              base_command, cwd=cwd, env=child_env,
              capture_output=True, text=True, timeout=180,
          )
          actual_summary = {}
          if actual.stdout.strip():
              try:
                  actual_summary = json.loads(actual.stdout.strip().splitlines()[-1])
              except Exception:
                  pass

          queued = False
          for path in (queue, dead):
              try:
                  queued = queued or norm(TARGET) in norm(path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          time.sleep(2)
          target_mid = ""
          reply_seen = False
          token = env.get("MAX_BOT_TOKEN", "")
          api_base = env.get("MAX_API_BASE", "https://platform-api2.max.ru").rstrip("/")
          for chat_id in [x.strip() for x in env.get("MAX_CHAT_ID", "").split(",") if x.strip()]:
              query = urllib.parse.urlencode({"chat_id": chat_id, "count": 100})
              request = urllib.request.Request(api_base + "/messages?" + query, headers={"Authorization": token})
              with urllib.request.urlopen(request, timeout=20) as response:
                  messages = json.loads(response.read()).get("messages") or []
              for message in messages:
                  text = str((message.get("body") or {}).get("text") or "")
                  if norm(TARGET) in norm(text):
                      target_mid = str((message.get("body") or {}).get("mid") or target_mid)
              for message in messages:
                  link = message.get("link") or (message.get("body") or {}).get("link") or {}
                  linked_mid = ""
                  if isinstance(link, dict):
                      linked = link.get("message") or {}
                      if isinstance(linked, dict):
                          linked_mid = str((linked.get("body") or {}).get("mid") or linked.get("mid") or "")
                      linked_mid = linked_mid or str(link.get("mid") or "")
                  if target_mid and linked_mid == target_mid:
                      reply_seen = True

          after = {
              "excel": digest(env.get("EXCEL_FILE_PATH")),
              "payroll": digest(env.get("PAYROLL_FILE_PATH")),
          }
          delivered = actual_summary.get("replayed") == 1 and not queued
          result = {
              "ok": delivered,
              "dry_run_classified": int(dry_summary.get("new_orders", 0)),
              "replayed": int(actual_summary.get("replayed", 0)),
              "queued_or_dead": queued,
              "ack_reply_seen": reply_seen,
              "excel_unchanged": before["excel"] == after["excel"],
              "payroll_unchanged": before["payroll"] == after["payroll"],
              "max_webhook_active": subprocess.run(
                  ["systemctl", "is-active", "--quiet", "max-webhook.service"]
              ).returncode == 0,
              "backup_created": backup.exists(),
          }
          print("APPROVED_A742_RECOVERY " + json.dumps(result, ensure_ascii=False))
          shutil.rmtree(os.environ["REMOTE_ROOT"], ignore_errors=True)
          if not all((
              result["ok"], result["excel_unchanged"], result["payroll_unchanged"],
              result["max_webhook_active"], result["backup_created"],
          )):
              raise SystemExit(1)
          PY
