name: Repair B2B Excel from 7 September

on:
  push:
    branches:
      - claude/max-excel-evacuation-automation-zxuvb4
    paths:
      - ".github/workflows/repair-excel-2026-09-07.yml"
  workflow_dispatch:

concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/max-excel-evacuation-automation-zxuvb4

      - name: Back up and rebuild both B2B workbooks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            'set -euo pipefail
             cd /opt/vladislaw
             git fetch origin claude/max-excel-evacuation-automation-zxuvb4
             git checkout claude/max-excel-evacuation-automation-zxuvb4
             git merge --ff-only origin/claude/max-excel-evacuation-automation-zxuvb4
             .venv/bin/pytest -q tests/test_reporting_rules.py
             systemctl stop max-webhook.service
             trap "systemctl start max-webhook.service" EXIT
             .venv/bin/python scripts/repair_excel_since.py --since 2026-09-07 --apply --quiet
             .venv/bin/python scripts/close_reminder_duplicates.py --since 2026-09-07
             systemctl start max-webhook.service
             trap - EXIT
             for attempt in 1 2 3 4 5; do
               if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
               sleep 2
             done
             systemctl status max-webhook.service --no-pager -l
             exit 1'
