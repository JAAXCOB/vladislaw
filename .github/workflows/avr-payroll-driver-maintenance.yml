name: AVR payroll driver maintenance
on:
  push:
    branches: [maintenance/gennady-payroll-20261013]
    paths: [.github/workflows/avr-payroll-driver-maintenance.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false
jobs:
  inspect-root-key-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CURRENT_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Test existing deploy key for root read-only access
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$CURRENT_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$CURRENT_HOST" \
            'set -eu; id; test -r /opt/vladislaw/data/excel/evacuation.xlsx && echo PAYROLL_READABLE; test -w /opt/vladislaw/data/excel/evacuation.xlsx && echo PAYROLL_WRITABLE'
