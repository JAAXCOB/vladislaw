name: AVR payroll driver maintenance
on:
  push:
    branches: [maintenance/gennady-payroll-20261013]
    paths: [.github/workflows/avr-payroll-driver-maintenance.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false
jobs:
  add-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - name: Add Gennady to confirmed payroll header only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$SERVER_HOST" = '130.49.173.150'
          test -n "$SERVER_USER"
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          PINFILE="$RUNNER_TEMP/avr-ihc-known-hosts"
          ssh-keyscan -T 15 -p 22 -t ed25519 130.49.173.150 2>/dev/null > "$PINFILE"
          test "$(ssh-keygen -lf "$PINFILE" -E sha256 | awk '{print $2}')" = 'SHA256:C5LClwcRJcnK0YoUDuLAfnkSMJM1zC3KTPtiVMBvN6s'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PINFILE" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SERVER_USER@130.49.173.150" 'cd /opt/vladislaw && .venv/bin/python -B -' <<'PY'
          import io, os, re, json, stat, hashlib, shutil, tempfile, zipfile, posixpath
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          from copy import copy
          from xml.sax.saxutils import escape, quoteattr
          
          NAME = 'Геннадий Щурихин'
          SHEET = 'Октябрь'
          EXPECTED_PATH = Path('/opt/vladislaw/data/excel/evacuation.xlsx')
          NS = {'s':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          REL = '{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id'
          
          def colnum(address):
              result = 0
              for c in re.match(r'[A-Z]+', address)[0]: result = result * 26 + ord(c) - 64
              return result
          
          def cell_text(c, strings):
              if c.attrib.get('t') == 'inlineStr':
                  return ''.join(t.text or '' for t in c.findall('.//s:t',NS))
              value = c.find('s:v',NS)
              if value is None: return ''
              if c.attrib.get('t') == 's': return strings[int(value.text)]
              return value.text or ''
          
          def prepare(original):
              with zipfile.ZipFile(io.BytesIO(original)) as z:
                  entries = z.infolist()
                  if len({e.filename for e in entries}) != len(entries):
                      raise RuntimeError('Duplicate archive entry')
                  if sum(e.file_size for e in entries) > 256 * 1024 * 1024:
                      raise RuntimeError('Workbook exceeds inspection limit')
                  wb = ET.fromstring(z.read('xl/workbook.xml'))
                  sheet = next(s for s in wb.find('s:sheets',NS) if s.attrib['name'] == SHEET)
                  relationships = ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
                  target = next(r.attrib['Target'] for r in relationships if r.attrib['Id'] == sheet.attrib[REL])
                  part = posixpath.normpath(target.lstrip('/') if target.startswith('/') else 'xl/' + target)
                  if not part.startswith('xl/worksheets/') or '..' in part:
                      raise RuntimeError('Unexpected worksheet relationship')
                  strings = []
                  if 'xl/sharedStrings.xml' in z.namelist():
                      ss = ET.fromstring(z.read('xl/sharedStrings.xml'))
                      strings = [''.join(t.text or '' for t in si.findall('.//s:t',NS)) for si in ss]
                  raw = z.read(part).decode('utf-8')
                  root = ET.fromstring(raw)
                  row = root.find("s:sheetData/s:row[@r='1']",NS)
                  if row is None: raise RuntimeError('Header row missing')
                  headers = [(c, cell_text(c,strings)) for c in row]
                  matches = [c for c,t in headers if set(t.casefold().split()) == set(NAME.casefold().split())]
                  if len(matches) > 1: raise RuntimeError('Duplicate Gennady headers')
                  if matches: return None, part, matches[0].attrib['r']
                  sources = [c for c,t in headers if set(t.casefold().split()) == {'бодров','максим'}]
                  if len(sources) != 1 or sources[0].attrib['r'] != 'Q1':
                      raise RuntimeError('Expected Bodrov payroll header Q1 missing')
                  if max(colnum(c.attrib['r']) for c,_ in headers) != 17:
                      raise RuntimeError('Unexpected payroll header layout')
                  if any(c.attrib.get('r') == 'R1' for c in root.findall('.//s:c',NS)):
                      raise RuntimeError('R1 is occupied')
                  if '<worksheet' not in raw or '<row ' not in raw:
                      raise RuntimeError('Unsupported XML prefix layout')
                  style = sources[0].attrib.get('s')
                  attrs = ' r="R1"' + (' s=' + quoteattr(style) if style is not None else '')
                  new_cell = '<c' + attrs + ' t="inlineStr"><is><t>' + escape(NAME) + '</t></is></c>'
                  pattern = r'(<row\b[^>]*\br="1"[^>]*>)(.*?)(</row>)'
                  edited, count = re.subn(pattern,lambda m:m[1]+m[2]+new_cell+m[3],raw,flags=re.S)
                  if count != 1: raise RuntimeError('Ambiguous header row')
                  dim = root.find('s:dimension',NS)
                  if dim is None: raise RuntimeError('Dimension missing')
                  old_ref = dim.attrib['ref']
                  end = old_ref.split(':')[-1]
                  if colnum(end) != 17: raise RuntimeError('Unexpected source dimension')
                  new_ref = old_ref.split(':')[0] + ':R' + re.search(r'\d+$',end)[0]
                  edited, count = re.subn(r'(<dimension\b[^>]*\bref=")[^"]+("[^>]*?/>)',lambda m:m[1]+new_ref+m[2],edited)
                  if count != 1: raise RuntimeError('Dimension patch failed')
                  cols = root.find('s:cols',NS)
                  existing_r = [] if cols is None else [c for c in cols if int(c.attrib['min']) <= 18 <= int(c.attrib['max'])]
                  if not existing_r:
                      q_columns = [] if cols is None else [c for c in cols if int(c.attrib['min']) <= 17 <= int(c.attrib['max'])]
                      width = q_columns[-1].attrib.get('width','26') if q_columns else '26'
                      new_col = '<col min="18" max="18" width=' + quoteattr(width) + ' customWidth="1"/>'
                      if cols is not None:
                          edited, count = re.subn(r'</cols>',new_col+'</cols>',edited)
                      else:
                          edited, count = re.subn(r'<sheetData>', '<cols>'+new_col+'</cols><sheetData>',edited)
                      if count != 1: raise RuntimeError('Column width patch failed')
                  new_root = ET.fromstring(edited)
                  new_row = new_root.find("s:sheetData/s:row[@r='1']",NS)
                  old_cells = [ET.tostring(c) for c in row]
                  if [ET.tostring(c) for c in new_row if c.attrib['r'] != 'R1'] != old_cells:
                      raise RuntimeError('Existing headers changed')
                  if [ET.tostring(r) for r in root.find('s:sheetData',NS) if r.attrib.get('r') != '1'] != [ET.tostring(r) for r in new_root.find('s:sheetData',NS) if r.attrib.get('r') != '1']:
                      raise RuntimeError('Existing payroll rows changed')
                  output = io.BytesIO()
                  with zipfile.ZipFile(output,'w') as out:
                      for info in entries:
                          out.writestr(copy(info),edited.encode('utf-8') if info.filename == part else z.read(info.filename))
                  after = output.getvalue()
                  with zipfile.ZipFile(io.BytesIO(after)) as check:
                      if check.testzip() is not None: raise RuntimeError('Archive validation failed')
                      if check.namelist() != z.namelist(): raise RuntimeError('Archive entries changed')
                      for info in entries:
                          if info.filename != part and check.read(info.filename) != z.read(info.filename):
                              raise RuntimeError('Unrelated workbook part changed')
                  return after, part, 'R1'
          
          def main():
              # The environment of the live service is authoritative; output never includes secrets.
              import subprocess
              import openpyxl
              from webhook.storage import file_lock, fsync_directory
              from webhook.payroll_writer import _match_employee_column
              from webhook.reporting_rules import employee_header
              result = subprocess.run(['systemctl','show','max-webhook.service','--property=MainPID','--value'],capture_output=True,text=True,timeout=5)
              pid = int(result.stdout.strip())
              if pid <= 0: raise RuntimeError('Live bot process not identified')
              configured = None
              for item in Path(f'/proc/{pid}/environ').read_bytes().split(b'\0'):
                  key, sep, value = item.partition(b'=')
                  if sep and key == b'PAYROLL_FILE_PATH': configured = value.decode()
              if not configured: raise RuntimeError('Live payroll path not available')
              path = Path(configured)
              if not path.is_absolute(): path = Path('/opt/vladislaw') / path
              if path.is_symlink() or path.resolve() != EXPECTED_PATH:
                  raise RuntimeError('Live payroll path changed; no write performed')
              with file_lock(path):
                  original_stat = path.stat()
                  if not stat.S_ISREG(original_stat.st_mode) or original_stat.st_size > 32*1024*1024:
                      raise RuntimeError('Unexpected workbook file')
                  before = path.read_bytes()
                  after, part, coordinate = prepare(before)
                  if after is None:
                      print('VERIFIED_ALREADY_PRESENT',json.dumps({'sheet':SHEET,'cell':coordinate,'employee':NAME},ensure_ascii=False)); return
                  backup_dir = Path('/opt/backups/avr-payroll-driver-add')
                  backup_dir.mkdir(parents=True,exist_ok=True,mode=0o700)
                  stamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S%fZ')
                  backup = backup_dir / ('actual-payroll-before-gennady-'+stamp+'.xlsx')
                  with backup.open('xb') as f:
                      os.fchmod(f.fileno(),0o600); f.write(before); f.flush(); os.fsync(f.fileno())
                  if backup.read_bytes() != before: raise RuntimeError('Backup verification failed')
                  fd, temporary_name = tempfile.mkstemp(prefix='.gennady-',suffix='.xlsx',dir=path.parent)
                  temporary = Path(temporary_name)
                  try:
                      with os.fdopen(fd,'wb') as f:
                          f.write(after)
                          os.fchown(f.fileno(),original_stat.st_uid,original_stat.st_gid)
                          os.fchmod(f.fileno(),stat.S_IMODE(original_stat.st_mode))
                          f.flush(); os.fsync(f.fileno())
                      wb = openpyxl.load_workbook(temporary,read_only=True,data_only=False)
                      if wb[SHEET][coordinate].value != NAME: raise RuntimeError('Saved header check failed')
                      if _match_employee_column(wb[SHEET],employee_header(NAME)) != 18:
                          raise RuntimeError('Bot employee matching failed')
                      wb.close()
                      if path.read_bytes() != before: raise RuntimeError('Concurrent uncooperative writer detected')
                      os.replace(temporary,path); fsync_directory(path.parent)
                      if path.read_bytes() != after: raise RuntimeError('Post-write verification failed')
                      current_stat = path.stat()
                      if (current_stat.st_uid,current_stat.st_gid,stat.S_IMODE(current_stat.st_mode)) != (original_stat.st_uid,original_stat.st_gid,stat.S_IMODE(original_stat.st_mode)):
                          raise RuntimeError('Ownership preservation failed')
                      print('VERIFIED_ADDED',json.dumps({'path':str(path),'sheet':SHEET,'cell':coordinate,'employee':NAME,'backup':str(backup),'other_parts_unchanged':True,'existing_rows_unchanged':True,'before_sha256':hashlib.sha256(before).hexdigest(),'after_sha256':hashlib.sha256(after).hexdigest()},ensure_ascii=False))
                  finally:
                      temporary.unlink(missing_ok=True)
          
          if __name__ == '__main__':
              try: main()
              except Exception as exc:
                  print('STOPPED',type(exc).__name__)
                  raise SystemExit(1)
          PY
