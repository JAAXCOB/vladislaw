name: AVR payroll driver maintenance
on:
  push:
    branches: [maintenance/gennady-payroll-20261013]
    paths: [.github/workflows/avr-payroll-driver-maintenance.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-max-bot-production
  cancel-in-progress: false
jobs:
  inspect-key-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.MAX_DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Verify restricted key access without changing server
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'if test -r /opt/vladislaw/data/excel/evacuation.xlsx; then echo PAYROLL_READABLE; else echo PAYROLL_NOT_READABLE; fi'
