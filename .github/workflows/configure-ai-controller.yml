name: Configure AVR AI controller credentials

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type CONFIGURE_AVR_AI_CONTROLLER to continue
        required: true
        type: string

concurrency:
  group: configure-avr-ai-controller-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    if: ${{ inputs.confirm_production == 'CONFIGURE_AVR_AI_CONTROLLER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH password client on the runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Configure controller and verify isolation
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          YANDEX_APP_PASSWORD: ${{ secrets.AVR_AI_YANDEX_APP_PASSWORD }}
          MAX_CONTROL_TOKEN: ${{ secrets.AVR_AI_MAX_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          test -n "$YANDEX_APP_PASSWORD"
          test -n "$MAX_CONTROL_TOKEN"

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' \
            '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' \
            >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          ssh_options=(
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20
          )
          expected_hash=219430cf93555d430bcf762e1050d5ab88aff10a642651b111d72a8409639600
          actual_hash="$(sshpass -e ssh "${ssh_options[@]}" root@130.49.173.150 \
            "sha256sum /home/maxdeploy/configure-controller-secrets.sh | awk '{print \$1}'")"
          test "$actual_hash" = "$expected_hash"

          printf '%s\n%s\n' "$YANDEX_APP_PASSWORD" "$MAX_CONTROL_TOKEN" \
            | sshpass -e ssh "${ssh_options[@]}" root@130.49.173.150 \
                'bash /home/maxdeploy/configure-controller-secrets.sh'

          unset YANDEX_APP_PASSWORD MAX_CONTROL_TOKEN SSHPASS
