name: Build AV Rescue Android APK

on:
  push:
    branches:
      - android-build-2.1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unpack Android 2.1.5 source
        run: |
          mkdir -p android-build/source-2.1.6
          unzip -q android-build/AVRescueAndroid_2.1.5_source.zip -d android-build/source-2.1.6
      - name: Apply Android 2.1.6 moderation update
        run: |
          cp android-build/overrides-2.1.6/app/build.gradle android-build/source-2.1.6/app/build.gradle
          cp android-build/overrides-2.1.6/app/src/main/java/ru/avrescue/app/ApiClient.java android-build/source-2.1.6/app/src/main/java/ru/avrescue/app/ApiClient.java
          cp android-build/overrides-2.1.6/app/src/main/java/ru/avrescue/app/DashboardActivity.java android-build/source-2.1.6/app/src/main/java/ru/avrescue/app/DashboardActivity.java
      - name: Build debug APK
        working-directory: android-build/source-2.1.6
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
      - name: Prepare driver APK
        run: |
          cp android-build/source-2.1.6/app/build/outputs/apk/debug/app-debug.apk AV_Rescue_Driver_2.1.6.apk
          sha256sum AV_Rescue_Driver_2.1.6.apk > AV_Rescue_Driver_2.1.6.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AV_Rescue_Driver_2.1.6
          path: |
            AV_Rescue_Driver_2.1.6.apk
            AV_Rescue_Driver_2.1.6.sha256
          if-no-files-found: error
          retention-days: 7
