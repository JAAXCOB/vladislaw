name: Build AV Rescue Android test apps

on:
  push:
    branches:
      - android-build-2.1.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unpack projects
        run: unzip -q android-test-build-source.zip -d android-test-build
      - name: Build Driver
        working-directory: android-test-build/AVRescueAndroid
        run: chmod +x gradlew && ./gradlew --no-daemon clean assembleDebug
      - name: Build Client and B2B
        working-directory: android-test-build/AVRescueClientAndroid
        run: chmod +x gradlew && ./gradlew --no-daemon clean assembleDebug
      - name: Name APK files
        run: |
          mkdir -p ready-apk
          cp android-test-build/AVRescueAndroid/app/build/outputs/apk/debug/app-debug.apk ready-apk/AVR_Driver_2.3.2.apk
          cp android-test-build/AVRescueClientAndroid/app/build/outputs/apk/debug/app-debug.apk ready-apk/AV_Rescue_Client_1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AV-Rescue-Android-test-apps
          path: ready-apk/*.apk
          if-no-files-found: error
          retention-days: 14
