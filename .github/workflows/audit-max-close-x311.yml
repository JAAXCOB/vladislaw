name: Audit MAX close X311TV797

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-max-close-x311.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only production audit
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no root@130.49.173.150 'bash -se' <<'SH'
          set -euo pipefail
          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          test -n "$pid"
          test "$pid" != 0
          app_root="$(readlink -f "/proc/$pid/cwd")"
          cmd0="$(tr '\0' '\n' <"/proc/$pid/cmdline" | head -n1)"
          py="$cmd0"
          case "$(basename "$py")" in *python*) ;; *) py="$(dirname "$cmd0")/python" ;; esac
          "$py" - "$pid" "$app_root" <<'PY'
          import json, os, re, sys, time
          from pathlib import Path
          import httpx

          pid, app_root = sys.argv[1:]
          os.chdir(app_root)
          sys.path.insert(0, app_root)
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  os.environ[key.decode(errors="ignore")] = value.decode(errors="ignore")

          from webhook.config import settings
          from webhook.models import Message
          from webhook.reporting_rules import normalize_plate, parse_explicit_closed_report, report_is_writable

          target = "Х311ТВ797"
          now_ms = int(time.time() * 1000)
          oldest_ms = now_ms - 24 * 3600 * 1000
          matches = []
          with httpx.Client(timeout=30, verify="/etc/ssl/certs/ca-certificates.crt") as client:
              for chat_id in sorted(settings.allowed_chat_ids):
                  response = client.get(
                      f"{settings.MAX_API_BASE}/messages",
                      headers={"Authorization": settings.max_bot_token},
                      params={"chat_id": chat_id, "from": now_ms, "to": oldest_ms, "count": 100},
                  )
                  response.raise_for_status()
                  for raw in response.json().get("messages") or []:
                      msg = Message.model_validate(raw)
                      text = msg.resolve_text() or ""
                      if normalize_plate(text) != target:
                          continue
                      job = parse_explicit_closed_report(text)
                      compact = " ".join(text.split()).casefold()
                      matches.append({
                          "age_minutes": max(0, (now_ms - int(raw.get("timestamp") or now_ms)) // 60000),
                          "has_close_phrase": bool(re.search(r"\bзаявк\w*\s+закрыт\w*\b", compact)),
                          "excluded_for_bot": "для бота" in compact,
                          "has_price_evidence": bool(re.search(r"эвакуац\w*\s+\d{3,5}|\d{2,5}\s*(?:р\.?|руб\.?|₽)|(?<!\d)4500(?!\d)|ложн\w*\s+подач|бустер|блок|мкад|вытаскиван|вытащ|вытян", compact)),
                          "deterministic_close": bool(job),
                          "report_writable": bool(job and report_is_writable(job)),
                      })

          queue_path = Path(settings.av_rescue_sync_queue_path)
          if not queue_path.is_absolute():
              queue_path = Path(app_root) / queue_path
          queue_hits = {"pending": 0, "dead": 0}
          for path in (queue_path, queue_path.with_name(queue_path.stem + ".dead" + queue_path.suffix)):
              if not path.exists():
                  continue
              try:
                  items = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for item in items if isinstance(items, list) else []:
                  payload = item.get("payload", item) if isinstance(item, dict) else {}
                  if normalize_plate(str(payload.get("license_plate") or "")) == target:
                      bucket = "dead" if ".dead." in path.name else "pending"
                      if payload.get("event") == "close":
                          queue_hits[bucket] += 1

          print("AUDIT_MAX_CLOSE " + json.dumps({
              "target": target,
              "matches": matches,
              "queue_hits": queue_hits,
              "webhook_active": os.system("systemctl is-active --quiet max-webhook.service") == 0,
          }, ensure_ascii=False))
          PY
          SH

