name: Diagnose MAX order N384RT797

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-max-order-n384.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Return approved N384 summary only
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20 root@130.49.173.150 'python3 -B -' <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          TARGET = "Н384РТ797"

          def run(args):
              return subprocess.run(args, capture_output=True, text=True, timeout=40)

          def norm(value):
              table = str.maketrans({"A":"А","B":"В","C":"С","E":"Е","H":"Н","K":"К","M":"М","O":"О","P":"Р","T":"Т","X":"Х","Y":"У"})
              return re.sub(r"[^А-Я0-9]", "", str(value).upper().replace("Ё", "Е").translate(table))

          pid = int(run(["systemctl", "show", "max-webhook.service", "-p", "MainPID", "--value"]).stdout.strip() or "0")
          env = {}
          if pid:
              for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                  if b"=" in raw:
                      key, value = raw.split(b"=", 1)
                      env[key.decode(errors="ignore")] = value.decode(errors="ignore")

          token = env.get("MAX_BOT_TOKEN", "")
          base = env.get("MAX_API_BASE", "https://platform-api2.max.ru").rstrip("/")
          chat_ids = [x.strip() for x in env.get("MAX_CHAT_ID", "").split(",") if x.strip()]
          found = None
          found_chat = ""
          for chat_id in chat_ids:
              query = urllib.parse.urlencode({"chat_id": chat_id, "count": 100})
              request = urllib.request.Request(base + "/messages?" + query, headers={"Authorization": token})
              with urllib.request.urlopen(request, timeout=20) as response:
                  messages = json.loads(response.read()).get("messages") or []
              for message in messages:
                  text = str((message.get("body") or {}).get("text") or "")
                  if norm(TARGET) in norm(text):
                      ts = int(message.get("timestamp") or 0)
                      if found is None or ts > int(found.get("timestamp") or 0):
                          found = message
                          found_chat = chat_id

          result = {
              "found_in_allowed_chat": found is not None,
              "algorithm_accepts": False,
              "has_pickup": False,
              "has_destination": False,
              "has_request_marker": False,
              "has_message_id": False,
              "found_in_pending_or_dead_event": False,
              "found_in_pending_site_sync": False,
              "found_in_dead_site_sync": False,
          }

          if found:
              text = str((found.get("body") or {}).get("text") or "")
              lowered = text.casefold()
              pickup = bool(re.search(r"(?im)^\s*Откуда\s*:\s*.+$", text))
              destination = bool(re.search(r"(?im)^\s*Куда\s*:\s*.+$", text))
              marker = "заяв" in lowered or "эваку" in lowered
              mid = str((found.get("body") or {}).get("mid") or "")
              result.update({
                  "algorithm_accepts": bool(pickup and destination and norm(TARGET) in norm(text) and marker),
                  "has_pickup": pickup,
                  "has_destination": destination,
                  "has_request_marker": marker,
                  "has_message_id": bool(mid),
                  "line_count": len([line for line in text.splitlines() if line.strip()]),
              })

              cwd = Path(os.readlink(f"/proc/{pid}/cwd")) if pid else Path("/opt/vladislaw")
              data_roots = [cwd / "data", Path("/opt/vladislaw/data")]
              inbox_hit = False
              for root in data_roots:
                  for state in ("pending", "processing", "dead"):
                      directory = root / "event_inbox" / state
                      if not directory.exists():
                          continue
                      for path in directory.glob("*.json"):
                          try:
                              if norm(TARGET) in norm(path.read_text(encoding="utf-8")):
                                  inbox_hit = True
                          except Exception:
                              pass
              result["found_in_pending_or_dead_event"] = inbox_hit

              raw_queue = env.get("AV_RESCUE_SYNC_QUEUE_PATH", "data/av_rescue_sync_queue.json")
              queue = Path(raw_queue)
              if not queue.is_absolute():
                  queue = cwd / queue
              dead = queue.with_name(queue.stem + ".dead" + queue.suffix)
              for key, path in (
                  ("found_in_pending_site_sync", queue),
                  ("found_in_dead_site_sync", dead),
              ):
                  try:
                      result[key] = norm(TARGET) in norm(path.read_text(encoding="utf-8"))
                  except Exception:
                      result[key] = False

          print("APPROVED_N384_TRACE " + json.dumps(result, ensure_ascii=False))
          PY
