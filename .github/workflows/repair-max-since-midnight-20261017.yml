name: Inspect safe MAX rollback target

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-max-since-midnight-20261017.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Normalize key and inspect installed rollback targets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MAX_DEPLOY_USER }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          install -d -m 0700 "$HOME/.ssh"
          python3 - <<'PY'
          import base64, os, pathlib
          raw=os.environ["SSH_PRIVATE_KEY"].replace("\r","")
          variants=[("raw",raw),("literal-newlines",raw.replace("\\n","\n"))]
          try:
              variants.append(("base64",base64.b64decode("".join(raw.split()),validate=True).decode()))
          except Exception:
              pass
          seen=set()
          for name,value in variants:
              if value in seen: continue
              seen.add(value)
              p=pathlib.Path.home()/".ssh"/f"candidate-{name}"
              p.write_text(value.rstrip("\n")+"\n",encoding="utf-8",newline="\n")
              p.chmod(0o600)
          print(f"KEY_DIAG length={len(raw)} lines={len(raw.splitlines())} literal_newlines={'\\n' in raw} candidates={len(seen)}")
          PY
          key=""
          for candidate in "$HOME"/.ssh/candidate-*; do
            if ssh-keygen -y -f "$candidate" >/dev/null 2>&1; then
              key="$candidate"
              echo "KEY_VALID variant=$(basename "$candidate")"
              break
            fi
          done
          test -n "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'SH'
          set -euo pipefail
          echo "SAFE_ACCESS user=$(id -un)"
          printf 'CURRENT '; readlink -f /opt/vladislaw/runtime/current || true
          echo "RELEASES"
          find /opt/vladislaw/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %f\n' 2>/dev/null | sort -nr | head -n 10
          echo "LEGACY_FILES"
          stat -c '%y %U:%G %a %n' /opt/vladislaw/scripts/reconcile_new_orders.py /opt/vladislaw/webhook/av_rescue_client.py 2>/dev/null || true
          echo "BACKUPS"
          find /opt/vladislaw/backups -mindepth 1 -maxdepth 1 -type d -name 'max-sync-queue-retry-*' -printf '%T@ %f\n' 2>/dev/null | sort -nr | head -n 5 || true
          echo "ACCESS_CHECK"
          /usr/local/bin/avr-max-deploy --check-access || true
          SH
