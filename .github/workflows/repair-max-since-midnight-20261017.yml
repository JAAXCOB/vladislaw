name: Inspect active MAX version before rollback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-max-since-midnight-20261017.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect active service and rollback files
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MAX_DEPLOY_USER }}
        run: |
          set -euo pipefail
          set +x
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'SH'
          set -euo pipefail
          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          echo "PID $pid"
          echo "SERVICE_CWD $(readlink -f "/proc/$pid/cwd" || true)"
          echo "SERVICE_EXE $(readlink -f "/proc/$pid/exe" || true)"
          echo "SERVICE_UNIT"
          systemctl cat max-webhook.service --no-pager | sed -n '1,120p'
          echo "RELEASE_ENTRIES"
          ls -lat /opt/vladislaw/releases 2>&1 | head -n 20
          current="$(readlink -f /opt/vladislaw/runtime/current)"
          echo "CURRENT_FILES"
          stat -c '%y %U:%G %a %n' "$current/scripts/reconcile_new_orders.py" "$current/webhook/av_rescue_client.py" 2>&1 || true
          echo "BACKUP_CONTENTS"
          latest="$(find /opt/vladislaw/backups -mindepth 1 -maxdepth 1 -type d -name 'max-sync-queue-retry-*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_BACKUP $latest"
          if [ -n "$latest" ]; then ls -la "$latest" 2>&1; fi
          SH
