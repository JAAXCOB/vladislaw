name: Restore previous working MAX release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-max-since-midnight-20261017.yml

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Switch MAX to previous untouched release and verify
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MAX_DEPLOY_USER }}
        run: |
          set -euo pipefail
          set +x
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'SH'
          set -Eeuo pipefail
          current_link=/opt/vladislaw/runtime/current
          target=/opt/vladislaw/releases/de9538f4fb53f87335d165688725535d9d04fb19
          restart=/usr/local/sbin/avr-max-restart
          old="$(readlink -f "$current_link")"
          test "$old" != "$target"
          test -d "$target"
          test -x "$target/.venv/bin/python"
          test -f "$target/webhook/main.py"
          test -f "$target/webhook/av_rescue_client.py"
          before_target="$old"
          before_hash="$(sha256sum "$old/webhook/av_rescue_client.py" | awk '{print $1}')"
          target_hash="$(sha256sum "$target/webhook/av_rescue_client.py" | awk '{print $1}')"
          rollback() {
            rm -f /opt/vladislaw/runtime/current.rollback
            ln -s "$old" /opt/vladislaw/runtime/current.rollback
            mv -Tf /opt/vladislaw/runtime/current.rollback "$current_link"
            sudo -n "$restart" || true
          }
          trap rollback ERR
          rm -f /opt/vladislaw/runtime/current.previous
          ln -s "$old" /opt/vladislaw/runtime/current.previous
          rm -f /opt/vladislaw/runtime/current.next
          ln -s "$target" /opt/vladislaw/runtime/current.next
          mv -Tf /opt/vladislaw/runtime/current.next "$current_link"
          sudo -n "$restart"
          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          test -n "$pid"
          test "$pid" != 0
          active="$(readlink -f "$current_link")"
          test "$active" = "$target"
          health="$(curl -fsS --max-time 5 http://127.0.0.1:8000/health)"
          trap - ERR
          printf 'RESTORED_PREVIOUS_MAX {"from":"%s","to":"%s","pid":"%s","old_client_hash":"%s","restored_client_hash":"%s","health":%s}\n' \
            "$before_target" "$active" "$pid" "$before_hash" "$target_hash" "$health"
          SH
