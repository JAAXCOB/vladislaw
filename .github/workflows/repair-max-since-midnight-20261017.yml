name: Inspect safe MAX rollback target

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-max-since-midnight-20261017.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect installed releases through protected deploy access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MAX_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MAX_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MAX_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MAX_DEPLOY_USER }}
        run: |
          set -euo pipefail
          set +x
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'SH'
          set -euo pipefail
          echo "SAFE_ACCESS user=$(id -un)"
          printf 'CURRENT '; readlink -f /opt/vladislaw/runtime/current || true
          echo "RELEASES"
          find /opt/vladislaw/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %f\n' 2>/dev/null | sort -nr | head -n 10
          echo "LEGACY_FILES"
          stat -c '%y %U:%G %a %n' /opt/vladislaw/scripts/reconcile_new_orders.py /opt/vladislaw/webhook/av_rescue_client.py 2>/dev/null || true
          echo "BACKUPS"
          find /opt/vladislaw/backups -mindepth 1 -maxdepth 1 -type d -name 'max-sync-queue-retry-*' -printf '%T@ %f\n' 2>/dev/null | sort -nr | head -n 5 || true
          echo "ACCESS_CHECK"
          /usr/local/bin/avr-max-deploy --check-access || true
          SH
