name: Install MAX sync queue retry and recover U647SE797 # retry 6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-max-sync-queue-retry-u647.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/max-order-reconciliation-20261016
      - name: Backup install verify and recover one order
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '130.49.173.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILs5wsOrECSBi1iiIo6psmhTxbAPFFCh9ZIp9QUNTmoE' >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          stage="/tmp/avr-sync-retry-${GITHUB_RUN_ID}"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@130.49.173.150 "install -d -m 0700 '$stage'"
          sshpass -e scp -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" scripts/reconcile_new_orders.py webhook/av_rescue_client.py root@130.49.173.150:"$stage/"
          sshpass -e ssh -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@130.49.173.150 "STAGE='$stage' bash -se" <<'SH'
          set -euo pipefail
          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          test -n "$pid"
          test "$pid" != 0
          app_root="$(readlink -f "/proc/$pid/cwd")"
          cmd0="$(tr '\0' '\n' <"/proc/$pid/cmdline" | head -n1)"
          py="$cmd0"
          case "$(basename "$py")" in *python*) ;; *) py="$(dirname "$cmd0")/python" ;; esac
          script_target="$app_root/scripts/reconcile_new_orders.py"
          client_target="$app_root/webhook/av_rescue_client.py"
          test -f "$script_target"
          test -f "$client_target"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="/opt/vladislaw/backups/max-sync-queue-retry-$stamp"
          install -d -m 0700 "$backup"
          cp -a "$script_target" "$backup/reconcile_new_orders.py"
          cp -a "$client_target" "$backup/av_rescue_client.py"

          "$py" - "$pid" "$app_root" "$backup" <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          pid, app_root, backup = sys.argv[1:]
          env = {}
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  env[key.decode(errors="ignore")] = value.decode(errors="ignore")
          configured = Path(env.get("AV_RESCUE_SYNC_QUEUE_PATH") or "data/av_rescue_sync_queue.json")
          old_queue = configured if configured.is_absolute() else Path(app_root) / configured
          shared_queue = Path("/opt/vladislaw/data") / configured.name
          backup_dir = Path(backup)
          backup_dir.joinpath("queue-paths.json").write_text(json.dumps({
              "old": str(old_queue),
              "shared": str(shared_queue),
              "shared_existed": shared_queue.exists(),
          }), encoding="utf-8")
          if shared_queue.exists():
              shutil.copy2(shared_queue, backup_dir / "queue.shared.before.json")
          def read(path):
              if not path.exists():
                  return []
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, list):
                  raise SystemExit(f"invalid queue: {path}")
              return value
          merged = {}
          for item in read(shared_queue) + read(old_queue):
              payload = item.get("payload", item) if isinstance(item, dict) else {}
              key = (payload.get("source_id"), payload.get("event"))
              if all(key):
                  merged[key] = item
          shared_queue.parent.mkdir(parents=True, exist_ok=True)
          temp = shared_queue.with_suffix(shared_queue.suffix + ".tmp")
          temp.write_text(json.dumps(list(merged.values()), ensure_ascii=False, indent=2), encoding="utf-8")
          os.replace(temp, shared_queue)
          PY
          chown maxbot:maxbot /opt/vladislaw/data/av_rescue_sync_queue.json
          chmod 0640 /opt/vladislaw/data/av_rescue_sync_queue.json

          "$py" - "$pid" "$backup/protected.before.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          pid, output = sys.argv[1:]
          env = {}
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  env[key.decode(errors="ignore")] = value.decode(errors="ignore")
          def digest(value):
              path = Path(value) if value else None
              if not path or not path.is_file():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024*1024), b""):
                      h.update(block)
              return h.hexdigest()
          Path(output).write_text(json.dumps({
              "excel": digest(env.get("EXCEL_FILE_PATH")),
              "payroll": digest(env.get("PAYROLL_FILE_PATH")),
          }), encoding="utf-8")
          PY

          committed=0
          rollback() {
            if [ "$committed" = 1 ]; then return; fi
            cp -a "$backup/reconcile_new_orders.py" "$script_target"
            cp -a "$backup/av_rescue_client.py" "$client_target"
            "$py" - "$backup" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          backup = Path(sys.argv[1])
          meta_path = backup / "queue-paths.json"
          if meta_path.exists():
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              shared = Path(meta["shared"])
              saved = backup / "queue.shared.before.json"
              if meta["shared_existed"] and saved.exists():
                  shutil.copy2(saved, shared)
              elif not meta["shared_existed"] and shared.exists():
                  shared.unlink()
          PY
            systemctl restart max-webhook.service || true
          }
          trap rollback ERR

          install -o maxbot -g maxbot -m 0750 "$STAGE/reconcile_new_orders.py" "$script_target"
          install -o maxbot -g maxbot -m 0640 "$STAGE/av_rescue_client.py" "$client_target"
          "$py" -m py_compile "$script_target" "$client_target"
          systemctl restart max-webhook.service
          systemctl is-active --quiet max-webhook.service
          if ! systemctl start max-order-reconcile.service; then
            systemctl status max-order-reconcile.service --no-pager || true
            journalctl -u max-order-reconcile.service -n 80 --no-pager -o cat || true
            exit 1
          fi
          test "$(systemctl show max-order-reconcile.service -p Result --value)" = success

          set +e
          replay_output="$(cd "$app_root" && AVR_RECONCILE_DATA_DIR=/opt/vladislaw/data "$py" scripts/reconcile_new_orders.py --hours 6 --only-plate 'У647СЕ797' 2>&1)"
          replay_status=$?
          set -e
          printf '%s\n' "$replay_output"
          test "$replay_status" = 0

          pid="$(systemctl show max-webhook.service -p MainPID --value)"
          test -n "$pid"
          test "$pid" != 0
          "$py" - "$pid" "$backup/protected.before.json" "$app_root" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          pid, before_path, app_root = sys.argv[1:]
          env = {}
          for raw in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
              if b"=" in raw:
                  key, value = raw.split(b"=", 1)
                  env[key.decode(errors="ignore")] = value.decode(errors="ignore")
          def digest(value):
              path = Path(value) if value else None
              if not path or not path.is_file():
                  return None
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024*1024), b""):
                      h.update(block)
              return h.hexdigest()
          before = json.loads(Path(before_path).read_text(encoding="utf-8"))
          if before["excel"] != digest(env.get("EXCEL_FILE_PATH")):
              raise SystemExit("Excel changed")
          if before["payroll"] != digest(env.get("PAYROLL_FILE_PATH")):
              raise SystemExit("Payroll changed")
          queue = Path(env.get("AV_RESCUE_SYNC_QUEUE_PATH") or "data/av_rescue_sync_queue.json")
          if not queue.is_absolute():
              queue = Path(app_root) / queue
          pending = []
          if queue.exists():
              for item in json.loads(queue.read_text(encoding="utf-8")):
                  payload = item.get("payload", item)
                  if payload.get("event") == "upsert" and payload.get("license_plate") == "У647СЕ797":
                      pending.append(payload.get("source_id"))
          if pending:
              raise SystemExit("U647SE797 is still pending")
          print("INSTALL_MAX_SYNC_QUEUE_RETRY "+json.dumps({
              "installed": True,
              "target_replayed": True,
              "target_queue_clear": True,
              "timer_active": os.system("systemctl is-active --quiet max-order-reconcile.timer") == 0,
              "max_webhook_active": os.system("systemctl is-active --quiet max-webhook.service") == 0,
              "excel_unchanged": True,
              "payroll_unchanged": True,
              "backup_created": True,
          }, sort_keys=True))
          PY

          committed=1
          trap - ERR
          rm -rf -- "$STAGE"
          SH
